name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Tao hoac dung khoa ky co dinh
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Them khoa ky co dinh"
            git push
          fi
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Luu cache Gradle va pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.pub-cache
          key: build-cache-${{ runner.os }}-${{ hashFiles('pubspec.yaml') }}
          restore-keys: |
            build-cache-${{ runner.os }}-

      - name: Tao khung du an Android
        run: flutter create --platforms=android --project-name theo_doi_luong app

      - name: Cau hinh Android cho van tay (local_auth)
        run: |
          python3 - <<'PY'
          import pathlib, re
          root = pathlib.Path("app/android/app/src/main")
          for f in root.rglob("MainActivity.*"):
              f.write_text(f.read_text().replace("FlutterActivity", "FlutterFragmentActivity"))
          manifest = root / "AndroidManifest.xml"
          text = manifest.read_text()
          if "USE_BIOMETRIC" not in text:
              perm = '<uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application'
              manifest.write_text(text.replace("<application", perm, 1))
          for f in root.glob("res/values*/styles.xml"):
              t = f.read_text()
              t = re.sub(r'parent="@android:style/Theme\.[A-Za-z.]*"', 'parent="Theme.AppCompat.DayNight.NoActionBar"', t)
              f.write_text(t)
          print("Da cau hinh Android")
          PY

      - name: Chep ma nguon va font
        run: |
          mkdir -p app/assets/fonts
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          cp LiberationSans-Regular.ttf LiberationSans-Bold.ttf app/assets/fonts/
          rm -f app/test/widget_test.dart

      - name: Tai package
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release --no-shrink --target-platform android-arm64 --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: theo-doi-luong-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
